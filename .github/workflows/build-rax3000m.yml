name: Build RAX3000M firmware

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: Upload firmware to a GitHub Release
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  CONFIG_FILE: defconfig/mt7981-ax3000.config
  FIRMWARE_DIR: bin/targets/mediatek/filogic
  TZ: Asia/Shanghai

jobs:
  build:
    name: RAX3000M 64G
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler \
            ecj fastjar flex g++ g++-multilib gawk gcc-multilib gettext git gperf \
            help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libreadline-dev libssl-dev libtool lld lrzsz mkisofs \
            msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-dev \
            python3-pip python3-ply python3-setuptools qemu-utils re2c rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd \
            zlib1g-dev
          sudo -E apt-get autoremove --purge -y
          sudo -E apt-get clean
          sudo timedatectl set-timezone "$TZ"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-rax3000m-dl-${{ hashFiles('feeds.conf.default', 'defconfig/mt7981-ax3000.config') }}
          restore-keys: |
            ${{ runner.os }}-rax3000m-dl-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install luci

      - name: Load RAX3000M config
        run: |
          cp "$CONFIG_FILE" .config
          scripts/getver.sh > version
          make defconfig
          grep -nE '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cmcc_rax3000m=|^CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        run: |
          make download -j$(nproc)
          find dl -size -1024c -print -delete

      - name: Build firmware
        id: compile
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "file_date=$(date +'%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Prepare firmware artifacts
        run: |
          test -d "$FIRMWARE_DIR"
          rm -rf "$FIRMWARE_DIR/packages"
          sha256sum "$FIRMWARE_DIR"/* > "$FIRMWARE_DIR/sha256sums.txt"
          ls -lh "$FIRMWARE_DIR"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-64g-${{ steps.compile.outputs.file_date }}
          path: ${{ env.FIRMWARE_DIR }}
          retention-days: 14

      - name: Upload firmware release
        if: inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rax3000m-${{ steps.compile.outputs.file_date }}
          name: RAX3000M firmware ${{ steps.compile.outputs.file_date }}
          files: ${{ env.FIRMWARE_DIR }}/*
